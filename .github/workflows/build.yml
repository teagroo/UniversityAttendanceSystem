name: Build Windows App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1
    
    - name: Restore NuGet packages
      run: nuget restore UniversityAttendanceSystem.sln
    
    - name: Build Release
      run: msbuild UniversityAttendanceSystem.sln /p:Configuration=Release /p:Platform="Any CPU"
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: UniversityAttendanceSystem-EXE
        path: bin/Release/
